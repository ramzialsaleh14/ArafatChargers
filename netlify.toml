# Netlify configuration for the Arafat Chargers Expo web build.
# Build locally with `npm run build:web`, which outputs to ./dist.

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  EXPO_NO_TELEMETRY = "1"

# Single page app: let the client handle unknown routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Expo emits hashed filenames under /_expo, so they can be cached forever.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated so new deploys are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker and the web app manifest must never be served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Browsers cache the tab icon aggressively; keep it revalidated so the logo
# replaces the previous favicon on the next visit.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The scanner needs camera access.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
